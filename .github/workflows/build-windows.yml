name: Build Windows

on:
  push:
    branches: [ci/windows-build]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      RUSTUP_TOOLCHAIN: 1.94.0

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.5'

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          cargo --version
          bun --version
          node --version

      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile

      - name: Test analytics consent
        run: bun test scripts/consent.test.ts scripts/analytics.test.ts

      - name: Build release installer
        run: bun run tauri build --bundles nsis --ci -- --locked

      - name: Test native desktop code
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --features custom-protocol --bin opcode

      - name: Collect binaries and checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item 'src-tauri/target/release/opcode.exe'
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer; found $($installers.Count)" }
          New-Item -ItemType Directory -Path 'windows-artifacts' | Out-Null
          Copy-Item $exe.FullName 'windows-artifacts/'
          Copy-Item $installers[0].FullName 'windows-artifacts/'
          Copy-Item 'LICENSE' 'windows-artifacts/'
          "Source: https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA`nUnsigned fork build. Not an official upstream release." | Set-Content 'windows-artifacts/BUILD.txt'
          Get-ChildItem 'windows-artifacts' -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content 'windows-artifacts/SHA256SUMS.txt'

      - name: Upload Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opcode-windows-x64-${{ github.sha }}
          path: windows-artifacts/
          if-no-files-found: error
          retention-days: 14
